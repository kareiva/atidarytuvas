<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP Client</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>HamLab Access</h1>

        <div id="registrationStatus" class="info-box">
            <p>SIP Status:</p>
            <p id="sipStatusText" class="status-text">Checking...</p>
        </div>

        <div id="buttonsContainer" class="buttons-container">
            <!-- Buttons will be dynamically generated here -->
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="info-text">
            <p>Opens via SIP call; auto-hangs-up after a few seconds.</p>
            <p><a href="https://wiki.int.hamlab.lt/runbooks/#gate-door-opener-atidarytuvas" target="_blank" rel="noopener">📱 Add to phone home screen — setup &amp; docs</a></p>
        </div>
    </div>

    <script>
        const buttonsContainer = document.getElementById('buttonsContainer');
        const statusMessage = document.getElementById('statusMessage');
        const sipStatusText = document.getElementById('sipStatusText');
        const registrationStatus = document.getElementById('registrationStatus');

        let callButtons = [];
        let isRegistered = false;

        // Load targets and create buttons
        async function loadTargets() {
            try {
                const response = await fetch('/targets');
                const data = await response.json();

                // Clear existing buttons
                buttonsContainer.innerHTML = '';
                callButtons = [];

                // Targets are ordered {id, label} objects (back-compat: plain
                // strings are still accepted).
                data.targets.forEach(t => {
                    const id = (typeof t === 'string') ? t : t.id;
                    const label = (typeof t === 'string')
                        ? (t.charAt(0) + t.slice(1).toLowerCase())
                        : t.label;
                    const button = document.createElement('button');
                    button.className = 'call-button';
                    button.textContent = `Open ${label}`;
                    button.dataset.target = id;
                    button.dataset.label = label;
                    button.disabled = !isRegistered;

                    button.addEventListener('click', () => makeCall(id, label, button));

                    buttonsContainer.appendChild(button);
                    callButtons.push(button);
                });
            } catch (error) {
                console.error('Error loading targets:', error);
                statusMessage.textContent = 'Error: Failed to load targets';
                statusMessage.className = 'status-message error';
            }
        }

        // Check SIP registration status
        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();

                if (data.registered) {
                    sipStatusText.textContent = 'Registered & Ready';
                    sipStatusText.className = 'status-text registered';
                    registrationStatus.className = 'info-box registered';
                    isRegistered = true;
                    callButtons.forEach(btn => btn.disabled = false);
                } else if (data.sip_client_initialized) {
                    sipStatusText.textContent = 'Connecting...';
                    sipStatusText.className = 'status-text connecting';
                    registrationStatus.className = 'info-box connecting';
                    isRegistered = false;
                    callButtons.forEach(btn => btn.disabled = true);
                } else {
                    sipStatusText.textContent = 'Not Connected';
                    sipStatusText.className = 'status-text error';
                    registrationStatus.className = 'info-box error';
                    isRegistered = false;
                    callButtons.forEach(btn => btn.disabled = true);
                }
            } catch (error) {
                sipStatusText.textContent = 'Status Unknown';
                sipStatusText.className = 'status-text error';
                registrationStatus.className = 'info-box error';
                isRegistered = false;
                callButtons.forEach(btn => btn.disabled = true);
            }
        }

        // Re-enable buttons + restore a button's label after a call finishes.
        function finishCall(button, originalText) {
            callButtons.forEach(btn => btn.disabled = false);
            button.textContent = originalText;
        }

        // Poll /lastcall until the outcome of this call lands, then show
        // green (delivered) or red (failed). startTs = epoch secs at dial time.
        function pollOutcome(target, label, button, originalText, startTs) {
            const deadline = Date.now() + 25000;  // give up after ~25s
            async function tick() {
                try {
                    const resp = await fetch(`/lastcall/${target}`);
                    const r = await resp.json();
                    const fresh = r && r.result && !r.in_progress &&
                                  r.timestamp && r.timestamp >= startTs - 3;
                    if (fresh) {
                        if (r.delivered) {
                            // Call reached the opener (it rang). Ring-and-open
                            // devices then reject (486/488/603) to signal open.
                            statusMessage.textContent = `${label} — signal delivered ✓`;
                            statusMessage.className = 'status-message success';
                        } else {
                            const sip = r.status ? ` (SIP ${r.status})` : '';
                            statusMessage.textContent =
                                `${label} — not delivered${sip}`;
                            statusMessage.className = 'status-message error';
                        }
                        finishCall(button, originalText);
                        return;
                    }
                } catch (e) { /* keep polling */ }
                if (Date.now() < deadline) {
                    setTimeout(tick, 1500);
                } else {
                    statusMessage.textContent = `${label}: result unknown (timeout)`;
                    statusMessage.className = 'status-message error';
                    finishCall(button, originalText);
                }
            }
            setTimeout(tick, 1500);
        }

        // Make a call to the specified target (id = internal, label = friendly)
        async function makeCall(target, label, button) {
            const originalText = button.textContent;

            // Disable all buttons during call
            callButtons.forEach(btn => btn.disabled = true);
            button.textContent = 'Opening...';
            statusMessage.textContent = `Opening ${label}...`;
            statusMessage.className = 'status-message info';

            try {
                const response = await fetch('/call', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ target: target })
                });

                const data = await response.json();

                if (data.success) {
                    // /call returns as soon as the INVITE is sent; the real
                    // outcome lands ~hangup_timeout later. Poll /lastcall and
                    // color the status green (delivered) or red (failed).
                    statusMessage.textContent = `Opening ${label}… (ringing)`;
                    statusMessage.className = 'status-message info';
                    pollOutcome(target, label, button, originalText, Date.now() / 1000);
                } else if (data.busy) {
                    // Another call is active (single call at a time) — not a failure.
                    statusMessage.textContent = 'Busy — another call in progress, try again';
                    statusMessage.className = 'status-message info';
                    finishCall(button, originalText);
                } else {
                    statusMessage.textContent = 'Error: ' + data.message;
                    statusMessage.className = 'status-message error';
                    finishCall(button, originalText);
                    // Re-check status in case registration was lost
                    checkStatus();
                }
            } catch (error) {
                statusMessage.textContent = 'Error: Failed to connect to server';
                statusMessage.className = 'status-message error';
                callButtons.forEach(btn => btn.disabled = false);
                button.textContent = originalText;
            }
        }

        // Initialize on page load
        loadTargets().then(() => {
            checkStatus();
            // Refresh status every 5 seconds
            setInterval(checkStatus, 5000);
        });
    </script>
</body>
</html>
